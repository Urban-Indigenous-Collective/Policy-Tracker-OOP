name: policy-tracker
services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${POLICY_HOST_PORT:-8002}:8000"
    volumes:
      - llm_cache:/app/cache
      - discovery_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health-check')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      nginx:
        condition: service_started
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-docker.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro

  redis:
    profiles: ["gateway"]
    image: redis:7-alpine
    restart: unless-stopped

  inference-gateway:
    profiles: ["gateway"]
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      GATEWAY_PORT: "8090"
    command: python inference_gateway/app.py
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  scheduler:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: python scheduler.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - llm_cache:/app/cache
      - discovery_data:/app/data
    depends_on:
      web:
        condition: service_healthy

  frontend:
    # "frontend" = local nginx+Next without tunnel; "tunnel" = prod public path.
    profiles: ["frontend", "tunnel"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://policy.urbanindigenouscollective.org}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-GTM-59N7L9FD}
        # Client bundle inlines this at build time — must match runtime intent.
        NEXT_PUBLIC_STATE_SUBSCRIBE_ENABLED: ${NEXT_PUBLIC_STATE_SUBSCRIBE_ENABLED:-false}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: ""
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://policy.urbanindigenouscollective.org}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-GTM-59N7L9FD}
      NEXT_PUBLIC_STATE_SUBSCRIBE_ENABLED: ${NEXT_PUBLIC_STATE_SUBSCRIBE_ENABLED:-false}
      INTERNAL_API_BASE: http://web:8000
    depends_on:
      web:
        condition: service_healthy

  nginx:
    profiles: ["frontend", "tunnel"]
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_HOST_PORT:-8095}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  llm_cache:
  discovery_data:
