<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Waking Up...</title>
  
  <!-- Google Fonts: Fjalla One -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: black;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: 'Fjalla One', sans-serif;
      text-align: center;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-top: 5px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .message {
      margin-top: 20px;
      font-size: 20px;
    }

    /* Style for the notification button */
    #notifButton {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: white;
      color: black;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: none; /* Hidden by default */
    }
  </style>
  
  <script>
    const backendURL = "https://policy.urbanindigenouscollective.org";

    async function checkServer() {
      try {
        const response = await fetch(backendURL, { method: "GET", mode: "cors" });
        if (response.ok) {
          sendNotification();
          // Delay redirect to allow notification to be seen
          setTimeout(() => {
            window.location.href = backendURL;
          }, 3000);
        }
      } catch (error) {
        console.log("Server is still waking up...");
      }
    }

    function requestNotificationPermission() {
      if ("Notification" in window) {
        Notification.requestPermission().then(permission => {
          console.log("Notification permission:", permission);
          if (permission === "granted") {
            // Hide the button once permission is granted
            document.getElementById("notifButton").style.display = "none";
          }
        });
      }
    }

    function sendNotification() {
      if (Notification.permission === "granted") {
        new Notification("Server is live!", {
          body: "Ready to analyze new MMIP policies",
          icon: "https://policy.urbanindigenouscollective.org/favicon.ico"
        });
      }
    }

    window.onload = () => {
      // Show the notification button if permission isn't already granted
      if (Notification.permission !== "granted") {
        document.getElementById("notifButton").style.display = "block";
      }
      checkServer();
    };

    // Continue checking every 5 seconds
    setInterval(checkServer, 5000);
  </script>
</head>
<body>
  <div class="spinner"></div>
  <p class="message">The server is starting up, please wait...</p>
  <button id="notifButton" onclick="requestNotificationPermission()">Enable Notifications</button>
</body>
</html>
