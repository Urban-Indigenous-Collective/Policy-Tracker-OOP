<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <script>
        async function checkServer() {
            try {
                const response = await fetch('https://policy.urbanindigenouscollective.org', { method: 'GET', mode: 'cors' });

                if (response.ok) {
                    window.location.href = "https://policy.urbanindigenouscollective.org";
                }
            } catch (error) {
                console.log("Server is still waking up...");
            }
        }
        
        setInterval(checkServer, 5000); // Check every 5 seconds
    </script>
</head>
<body>
    <h2>Loading... Please wait while the server wakes up.</h2>
    <p>This page will refresh automatically when the server is ready.</p>
</body>
</html>
