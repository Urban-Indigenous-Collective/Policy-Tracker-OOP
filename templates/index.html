<!-- templates/index.html -->
<html>
<head>
    <title>Process LegiScan URLs</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        $(document).ready(function(){
            var lastLogCount = 0;

            function renderLog(lines) {
                if (!lines || !lines.length) {
                    return;
                }
                var logEl = $("#activityLog");
                var shouldStick = logEl[0].scrollHeight - logEl.scrollTop() <= logEl.outerHeight() + 40;
                logEl.text(lines.join("\n"));
                if (shouldStick) {
                    logEl.scrollTop(logEl[0].scrollHeight);
                }
                lastLogCount = lines.length;
            }

            function formatStatus(response) {
                var parts = [response.status || "Processing..."];
                if (response.phase_label) {
                    parts.push(response.phase_label);
                }
                if (response.detail) {
                    parts.push("(" + response.detail + ")");
                }
                if (typeof response.progress === "number") {
                    parts.push(Math.round(response.progress) + "%");
                }
                return parts.join(" — ");
            }

            function handleComplete(response) {
                if (response.file_url) {
                    window.parent.postMessage({ downloadUrl: response.file_url}, '*');
                    window.location.href = response.file_url;
                }
            }

            function fetchUpdate() {
                $.ajax({
                    url: "/status",
                    type: "GET",
                    success: function(response) {
                        $("#status").text(formatStatus(response));
                        $("#progressBar").prop('value', response.progress || 0);
                        if (response.log && response.log.length !== lastLogCount) {
                            renderLog(response.log);
                        }

                        if (response.status === "Complete") {
                            handleComplete(response);
                        } else if (response.status === "Failed") {
                            $("#status").text(response.message || "Processing failed.");
                        } else {
                            setTimeout(fetchUpdate, 1000);
                        }
                    }
                });
            }

            $("#submit").click(function(e) {
                e.preventDefault();
                var links = $("#links").val();

                lastLogCount = 0;
                $("#status").text("Starting...");
                $("#progressBar").prop('value', 0);
                $("#activityLog").text("");

                $.ajax({
                    url: "/process",
                    type: "POST",
                    data: { links: links },
                    success: function(response) {
                        if (response.status === "Complete" && response.file_url) {
                            handleComplete(response);
                        } else {
                            fetchUpdate();
                        }
                    },
                    error: function(xhr) {
                        if (xhr.status === 409) {
                            $("#status").text("Already processing...");
                        } else {
                            $("#status").text("Processing...");
                        }
                        fetchUpdate();
                    }
                });
            });
        });
    </script>
</head>
<body style="background-color: #000; color: #fff">
    <div>
        <h1 class="app-label" for="links">Enter Policy Links (comma separated):</h1>

        <form class="app-form">
            <textarea class="app-input" type="text" id="links" name="links"></textarea>
            <button class="button" id="submit">Submit</button>
        </form>

        <div class="progress-container">
            <div id="status">Idle</div>
            <progress id="progressBar" value="0" max="100"></progress>
            <pre id="activityLog" aria-live="polite"></pre>
        </div>
    </div>
</body>
</html>
